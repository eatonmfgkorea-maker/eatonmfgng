<body>
<div id="app" class="root"></div>
<div id="toast" class="toast" style="display:none"></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbydlHZNqX86-A2kpFbQeYRMMmt2dnbYuxAWzdkNqqtWJqPfG5ZDjOIbHy8eUfJdmfxv/exec";
let settings=null,history=[],form=newForm(),currentTab="register",previewMode=false,detailItem=null,settingsPage=null,sending=false,toastTimer=null;
const DEFAULT_SETTINGS={lines:{TCP:[],FE:[]},products:{},partNumbers:{},recipients:{TCP:[],FE:[]}};

function newForm(){return{division:"",type:"",reporter:"",title:"",date:new Date().toISOString().slice(0,10),shift:"",line:"",process:"",product:"",partNo:"",dtStart:"",dtEnd:"",problem:"",action:"",etc:"",photos:[],recurrence:"",additional:""};}
function parseTime(v){if(!v)return"";v=String(v);if(v.includes("T")){const d=new Date(v);if(!isNaN(d))return("0"+d.getUTCHours()).slice(-2)+":"+("0"+d.getUTCMinutes()).slice(-2);}if(v.includes(":"))return v.slice(0,5);return"";}
function calcDT(s,e){s=parseTime(s);e=parseTime(e);if(!s||!e)return"-";const[sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number);let d=(eh*60+em)-(sh*60+sm);if(d<0)d+=1440;return d>=60?`${Math.floor(d/60)}시간 ${d%60}분`:`${d}분`;}
function showToast(msg,type){const el=document.getElementById("toast");el.textContent=msg;el.style.display="block";el.style.background=type==="error"?"#dc2626":type==="warn"?"#d97706":"#16a34a";clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display="none";},3000);}

async function fetchServer(p){const r=await fetch(SCRIPT_URL+"?"+p,{redirect:"follow"});const t=await r.text();try{return JSON.parse(t);}catch{return{};}}
async function postServer(p){const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(p),redirect:"follow"});const t=await r.text();try{return JSON.parse(t);}catch{return{success:true};}}
async function loadSettingsFromServer(){try{const d=await fetchServer("action=getSettings");if(d.settings){settings=d.settings;localStorage.setItem("defect-st-cache",JSON.stringify(settings));return;}}catch(e){}try{const c=localStorage.getItem("defect-st-cache");settings=c?JSON.parse(c):JSON.parse(JSON.stringify(DEFAULT_SETTINGS));}catch{settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));}}
async function saveSettingsToServer(){localStorage.setItem("defect-st-cache",JSON.stringify(settings));try{await postServer({action:"saveSettings",settings});}catch(e){console.log("서버 저장 실패");}}
function loadHistory(){try{const v=localStorage.getItem("defect-hist-v7");history=v?JSON.parse(v):[];}catch{history=[];}}
function saveHistory(){localStorage.setItem("defect-hist-v7",JSON.stringify(history));}

// ─── Email HTML (Gmail-safe table-based) ───
function buildEmailHTML(f,photoUrls){
  photoUrls=photoUrls||[];
  const dc=f.division==="TCP"?"#c0392b":"#2471a3",tc={"설비":"#8e44ad","단품품질":"#d68910","자재":"#1a5276"}[f.type]||"#555555",rc=f.recurrence==="재발"?"#c0392b":"#27ae60",dt=calcDT(f.dtStart,f.dtEnd);
  const badge=(t,c)=>`<td style="padding:0 2px;"><table cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="${c}" style="padding:4px 12px;color:#ffffff;font-size:12px;font-weight:bold;">${t}</td></tr></table></td>`;
  const infoRow=(l,v)=>v?`<tr><td style="padding:10px 16px;font-size:13px;color:#6b7280;border-bottom:1px solid #f3f4f6;width:100px;vertical-align:top;">${l}</td><td style="padding:10px 16px;font-size:14px;color:#111827;font-weight:500;border-bottom:1px solid #f3f4f6;">${v}</td></tr>`:"";
  const block=(label,text,color)=>text?`<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:12px 20px 4px 20px;font-size:13px;font-weight:bold;color:${color};">[${label}]</td></tr><tr><td style="padding:4px 20px 16px 20px;font-size:14px;color:#1f2937;line-height:1.7;">${String(text).replace(/\n/g,'<br>')}</td></tr></table>`:"";
  const dtS=parseTime(f.dtStart),dtE=parseTime(f.dtEnd),dtVal=dtS&&dtE?`${dtS} ~ ${dtE} (${dt})`:"";
  let ph="";
  if(photoUrls.length>0){ph=`<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:12px 20px 4px 20px;font-size:13px;font-weight:bold;color:#6b7280;">[첨부 사진]</td></tr><tr><td style="padding:4px 20px 16px 20px;">${photoUrls.map((u,i)=>`<a href="${u}" target="_blank" style="display:inline-block;margin-right:8px;margin-bottom:8px;"><img src="${u}" width="260" style="max-width:260px;height:auto;border:1px solid #e5e7eb;" /></a>`).join("")}</td></tr></table>`;}
  return`<table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;">`
  +`<tr><td bgcolor="#1e293b" style="padding:20px 24px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:18px;font-weight:bold;color:#ffffff;">불량 공지</td><td align="right"><table cellpadding="0" cellspacing="0" border="0"><tr>${badge(f.division,dc)}${badge(f.type,tc)}${f.recurrence?badge(f.recurrence,rc):""}</tr></table></td></tr></table><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:14px 0 4px 0;font-size:20px;font-weight:bold;color:#ffffff;">${f.title||"(제목 없음)"}</td></tr></table></td></tr>`
  +`<tr><td bgcolor="#ffffff" style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0">${infoRow("보고자",f.reporter)}${infoRow("날짜",f.date)}${infoRow("근무",f.shift)}${infoRow("라인",f.line)}${infoRow("공정",f.process)}${infoRow("제품명",f.product)}${infoRow("Part No",f.partNo)}${infoRow("Down Time",dtVal)}</table></td></tr>`
  +`<tr><td bgcolor="#ffffff" style="padding:0 20px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:2px solid #fecaca;"></td></tr></table></td></tr>`
  +`<tr><td bgcolor="#ffffff">${block("문제점",f.problem,"#dc2626")}${block("조치사항",f.action,"#2563eb")}${block("기타",f.etc,"#6b7280")}${block("추가내용",f.additional,"#6b7280")}${ph}</td></tr>`
  +`<tr><td bgcolor="#f8fafc" style="padding:14px 20px;text-align:center;border-top:1px solid #e5e7eb;"><span style="font-size:11px;color:#9ca3af;">MFG &middot; 불량 공지 시스템</span></td></tr></table>`;
}

// ─── Excel 파싱 ───
function parseExcel(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const data=XLSX.utils.sheet_to_json(ws,{header:1});
        // 첫 행은 헤더, 나머지 파싱
        const lines={},products={},partNumbers={};
        let count=0;
        for(let i=1;i<data.length;i++){
          const r=data[i];if(!r||!r[0])continue;
          const div=String(r[0]).trim(),line=String(r[1]||"").trim(),prod=String(r[2]||"").trim(),pn=String(r[3]||"").trim();
          if(!div||!line)continue;
          if(!lines[div])lines[div]=[];
          if(!lines[div].includes(line))lines[div].push(line);
          const lk=`${div}-${line}`;
          if(prod){if(!products[lk])products[lk]=[];if(!products[lk].includes(prod))products[lk].push(prod);}
          if(prod&&pn){const pk=`${lk}__${prod}`;if(!partNumbers[pk])partNumbers[pk]=[];if(!partNumbers[pk].includes(pn))partNumbers[pk].push(pn);count++;}
        }
        resolve({lines,products,partNumbers,count});
      }catch(err){reject(err);}
    };
    reader.onerror=()=>reject(new Error("파일 읽기 실패"));
    reader.readAsArrayBuffer(file);
  });
}

// ─── DOM helpers ───
function h(tag,attrs,...ch){const el=document.createElement(tag);if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(el.style,v);else if(k==="className")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="innerHTML")el.innerHTML=v;else el.setAttribute(k,v);});ch.flat(9).forEach(c=>{if(c!=null&&c!==false)el.appendChild(typeof c==="string"?document.createTextNode(c):c);});return el;}
function chip(label,selected,onClick,color){const el=h("button",{className:"chip"+(selected?" on":""),onClick},label);if(selected)el.style.background=color||"#0f172a";return el;}
function section(title,...ch){return h("div",{className:"section"},h("div",{className:"sec-title"},title),...ch);}
function label(text,req){const el=h("label",{className:"lbl"},text);if(req)el.appendChild(h("span",{className:"req"}," *"));return el;}

// ═══════ PHOTO EDITOR ═══════
let editorState = null;

function openEditor(photoIdx) {
  const photo = form.photos[photoIdx];
  const img = new Image();
  img.onload = () => {
    editorState = {
      idx: photoIdx, img, shapes: [], currentTool: 'arrow',
      color: '#dc2626', lineWidth: 3, drawing: false,
      startX: 0, startY: 0, points: [],
    };
    renderEditor();
  };
  img.src = photo.data;
}

function renderEditor() {
  const st = editorState; if (!st) return;
  // Remove existing
  let ov = document.getElementById('photo-editor');
  if (ov) ov.remove();

  ov = h('div', { id: 'photo-editor', className: 'editor-overlay' });

  // ─── Top bar ───
  const top = h('div', { className: 'editor-top' });
  top.appendChild(h('span', { style: { color: '#9ca3af', fontSize: '13px', fontWeight: '600' } }, '사진 편집'));
  const undoBtn = h('button', { className: 'ebtn ebtn-undo', onClick: () => { st.shapes.pop(); drawCanvas(); } }, '↩ 실행취소');
  top.appendChild(undoBtn);
  ov.appendChild(top);

  // ─── Canvas ───
  const cWrap = h('div', { className: 'editor-canvas-wrap' });
  // Scale canvas to fit screen
  const maxW = window.innerWidth, maxH = window.innerHeight - 200;
  let cw = st.img.width, ch = st.img.height;
  const ratio = Math.min(maxW / cw, maxH / ch, 1);
  cw = Math.round(cw * ratio); ch = Math.round(ch * ratio);

  const canvas = h('canvas', { id: 'ed-canvas', width: String(st.img.width), height: String(st.img.height) });
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  const scaleX = st.img.width / cw, scaleY = st.img.height / ch;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect.top) * scaleY };
  }

  function onStart(e) {
    e.preventDefault(); st.drawing = true;
    const p = getPos(e); st.startX = p.x; st.startY = p.y;
    if (st.currentTool === 'pen') st.points = [p];
  }
  function onMove(e) {
    if (!st.drawing) return; e.preventDefault();
    const p = getPos(e);
    if (st.currentTool === 'pen') { st.points.push(p); }
    drawCanvas(p);
  }
  function onEnd(e) {
    if (!st.drawing) return; st.drawing = false;
    const p = e.changedTouches ? getPos(e.changedTouches[0]) : (e.touches ? getPos(e) : getPos(e));
    const shape = { tool: st.currentTool, color: st.color, lineWidth: st.lineWidth, x1: st.startX, y1: st.startY, x2: p.x, y2: p.y };
    if (st.currentTool === 'pen') shape.points = [...st.points];
    // Skip tiny shapes (accidental taps)
    const dx = Math.abs(shape.x2 - shape.x1), dy = Math.abs(shape.y2 - shape.y1);

function drawCanvas(livePos) {
  const st = editorState; if (!st) return;
  const c = document.getElementById('ed-canvas'); if (!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(st.img, 0, 0, c.width, c.height);

  // Draw saved shapes
  st.shapes.forEach(s => drawShape(ctx, s));

  // Draw live preview
  if (st.drawing && livePos) {
    const live = { tool: st.currentTool, color: st.color, lineWidth: st.lineWidth, x1: st.startX, y1: st.startY, x2: livePos.x, y2: livePos.y };
    if (st.currentTool === 'pen') live.points = st.points;
    ctx.globalAlpha = 0.7;
    drawShape(ctx, live);
    ctx.globalAlpha = 1;
  }
}

function drawShape(ctx, s) {
  ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.lineWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if (s.tool === 'rect') {
    ctx.beginPath();
    ctx.rect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
    ctx.stroke();
  }
  else if (s.tool === 'circle') {
    const cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
    const rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  else if (s.tool === 'arrow') {
    // Line
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    // Arrowhead
    const angle = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
    const headLen = Math.max(12, s.lineWidth * 5);
    ctx.beginPath();
    ctx.moveTo(s.x2, s.y2);
    ctx.lineTo(s.x2 - headLen * Math.cos(angle - 0.4), s.y2 - headLen * Math.sin(angle - 0.4));
    ctx.lineTo(s.x2 - headLen * Math.cos(angle + 0.4), s.y2 - headLen * Math.sin(angle + 0.4));
    ctx.closePath(); ctx.fill();
  }
  else if (s.tool === 'pen' && s.points && s.points.length > 1) {
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
  }
}

  const g1=h("div",{className:"set-group"});g1.appendChild(h("div",{className:"set-group-title"},"메일 수신자"));
  g1.appendChild(sc("recipients","📧","수신자 관리 (TCP / FE 별도)",`TCP ${(settings.recipients.TCP||[]).filter(r=>r.active).length}명 · FE ${(settings.recipients.FE||[]).filter(r=>r.active).length}명`));
  w.appendChild(g1);

  const g2=h("div",{className:"set-group"});g2.appendChild(h("div",{className:"set-group-title"},"제품 / Part No 데이터"));
  const totalLines=Object.values(settings.lines||{}).flat().length;
  const totalProducts=Object.values(settings.products||{}).reduce((a,v)=>a+v.length,0);
  const totalPN=Object.values(settings.partNumbers||{}).reduce((a,v)=>a+v.length,0);
  g2.appendChild(sc("partdata","📦","라인 / 제품명 / Part No 관리",`라인 ${totalLines}개 · 제품 ${totalProducts}개 · Part No ${totalPN}개`));
  w.appendChild(g2);

  body.appendChild(w);
}

// ─── Recipients ───
function renderRecip(w){
  let sd="TCP";
  w.appendChild(h("button",{className:"back-btn",onClick:()=>{settingsPage=null;render();}},"← 설정"));
  const sec=section("수신자 관리");sec.appendChild(h("p",{style:{fontSize:"12px",color:"#9ca3af",margin:"0 0 10px"}},"TCP와 FE 수신자를 별도 관리합니다."));
  const dc=h("div",{className:"chips",style:{marginBottom:"12px"}}),lw=h("div",{id:"recip-list"});
  function rDC(){dc.innerHTML="";["TCP","FE"].forEach(v=>dc.appendChild(chip(`${v} 수신자`,sd===v,()=>{sd=v;rDC();rList();},v==="TCP"?"#c0392b":"#2471a3")));}
  function rList(){const el=document.getElementById("recip-list");if(!el)return;el.innerHTML="";const list=settings.recipients[sd]||[];
    const row=h("div",{style:{display:"flex",gap:"6px",marginBottom:"10px"}});const iN=h("input",{className:"inp",placeholder:"이름",style:{flex:"1",minWidth:"0"}}),iE=h("input",{className:"inp",placeholder:"이메일",style:{flex:"2",minWidth:"0"}});
    const ab=h("button",{className:"add-btn",onClick:()=>{if(!iN.value.trim()||!iE.value.trim()){showToast("이름과 이메일 입력","error");return;}if(!settings.recipients[sd])settings.recipients[sd]=[];settings.recipients[sd].push({name:iN.value.trim(),email:iE.value.trim(),active:true});saveSettingsToServer();rList();}},"+");
    iE.addEventListener("keydown",e=>{if(e.key==="Enter")ab.click();});row.appendChild(iN);row.appendChild(iE);row.appendChild(ab);el.appendChild(row);
    if(!list.length)el.appendChild(h("div",{style:{textAlign:"center",padding:"20px",color:"#d1d5db",fontSize:"13px"}},"등록된 수신자가 없습니다"));
    list.forEach((r,i)=>{const it=h("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"8px 0",borderBottom:"1px solid #f3f4f6"}});
      it.appendChild(h("button",{className:"toggle-btn",style:{background:r.active?"#16a34a":"#d1d5db"},onClick:()=>{r.active=!r.active;saveSettingsToServer();rList();}},r.active?"✓":""));
      const info=h("div",{style:{flex:"1",minWidth:"0"}});info.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"600",color:r.active?"#111827":"#9ca3af"}},r.name));info.appendChild(h("div",{style:{fontSize:"12px",color:"#9ca3af",overflow:"hidden",textOverflow:"ellipsis"}},r.email));it.appendChild(info);
      it.appendChild(h("button",{className:"del-btn",onClick:()=>{settings.recipients[sd].splice(i,1);saveSettingsToServer();rList();}},"✕"));el.appendChild(it);});}
  sec.appendChild(dc);sec.appendChild(lw);w.appendChild(sec);rDC();setTimeout(rList,0);
}

// ─── Part No 데이터 관리 (엑셀 업로드) ───
function renderPartData(w){
  w.appendChild(h("button",{className:"back-btn",onClick:()=>{settingsPage=null;render();}},"← 설정"));
  const sec=section("라인 / 제품명 / Part No 관리");

  // 현황 통계
  const totalLines=Object.values(settings.lines||{}).flat().length;
  const totalProducts=Object.values(settings.products||{}).reduce((a,v)=>a+v.length,0);
  const totalPN=Object.values(settings.partNumbers||{}).reduce((a,v)=>a+v.length,0);

  const statBox=h("div",{className:"stat-box"});
  [["라인",totalLines],["제품",totalProducts],["Part No",totalPN]].forEach(([l,n])=>{
    const item=h("div",{className:"stat-item"});
    item.appendChild(h("div",{className:"stat-num"},String(n)));
    item.appendChild(h("div",{className:"stat-label"},l));
    statBox.appendChild(item);
  });
  sec.appendChild(statBox);

  // 현재 구분별 라인 표시
  ["TCP","FE"].forEach(d=>{
    const lines=settings.lines[d]||[];
    if(lines.length){
      const dv=h("div",{style:{marginTop:"12px"}});
      dv.appendChild(h("div",{style:{fontSize:"12px",fontWeight:"700",color:d==="TCP"?"#c0392b":"#2471a3",marginBottom:"4px"}},`${d} 라인: ${lines.join(", ")}`));
      sec.appendChild(dv);
    }
  });

  // 업로드 영역
  sec.appendChild(h("div",{style:{marginTop:"16px",marginBottom:"8px",fontSize:"13px",fontWeight:"700",color:"#111827"}},"엑셀 파일 업로드"));
  sec.appendChild(h("p",{style:{fontSize:"12px",color:"#9ca3af",margin:"0 0 10px",lineHeight:"1.5"}},"구분 / 라인명 / 제품명 / Part No 4개 열로 된 엑셀 파일을 업로드하면 자동으로 반영됩니다."));

  const uploadZone=h("div",{className:"upload-zone",onClick:()=>document.getElementById("excel-input").click()},
    h("div",{style:{fontSize:"32px",marginBottom:"6px"}},"📄"),
    h("div",{style:{fontSize:"14px",fontWeight:"600",color:"#4338ca"}},"엑셀 파일 선택"),
    h("div",{style:{fontSize:"12px",color:"#9ca3af",marginTop:"4px"}},".xlsx 파일")
  );
  sec.appendChild(uploadZone);

  const fileInp=h("input",{id:"excel-input",type:"file",accept:".xlsx,.xls",style:{display:"none"}});
  fileInp.addEventListener("change",async(e)=>{
    const file=e.target.files[0];if(!file)return;
    uploadZone.innerHTML="<div style='color:#6366f1;font-weight:600;'>⏳ 파싱 중...</div>";
    try{
      const result=await parseExcel(file);
      settings.lines=result.lines;
      settings.products=result.products;
      settings.partNumbers=result.partNumbers;
      await saveSettingsToServer();
      showToast(`✅ ${result.count}개 Part No 데이터 업로드 완료!`);
      render();
    }catch(err){
      showToast("엑셀 파싱 실패: "+err.message,"error");
      uploadZone.innerHTML="<div style='color:#dc2626;'>❌ 파싱 실패. 다시 시도하세요.</div>";
    }
    fileInp.value="";
  });
  sec.appendChild(fileInp);

  // 초기화 버튼
  sec.appendChild(h("button",{style:{marginTop:"16px",width:"100%",padding:"10px",borderRadius:"8px",border:"1px solid #fecaca",background:"#fff",color:"#dc2626",fontSize:"13px",fontWeight:"600",cursor:"pointer"},onClick:()=>{
    if(!confirm("모든 라인/제품/Part No 데이터를 초기화하시겠습니까?"))return;
    settings.lines={TCP:[],FE:[]};settings.products={};settings.partNumbers={};
    saveSettingsToServer();showToast("데이터 초기화 완료");render();
  }},"🗑 데이터 초기화"));

  w.appendChild(sec);
}

// ═══ INIT ═══
(async()=>{render();await loadSettingsFromServer();loadHistory();render();})();
</script>
</body>
